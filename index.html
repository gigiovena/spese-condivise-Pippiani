<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spese di Casa 🏠</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-4 max-w-md mx-auto">

  <header class="mb-6 text-center">
    <h1 class="text-2xl font-bold text-gray-800">🏠 Spese di Casa</h1>
    <div id="saldoCard" class="mt-3 p-4 bg-white rounded-xl shadow border-l-4 border-indigo-500 text-left">
      <p class="text-xs font-semibold text-gray-400 uppercase">Saldo Attuale</p>
      <p id="testoSaldo" class="text-lg font-bold text-gray-800 mt-1">Caricamento...</p>
    </div>
  </header>

  <!-- FORM DI INSERIMENTO -->
  <section class="bg-white p-5 rounded-xl shadow mb-6">
    <h2 class="text-lg font-bold mb-4 text-gray-700">✍️ Nuova Registrazione</h2>
    
    <form id="expenseForm" onsubmit="inviaDati(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Tipo</label>
        <select id="tipo" class="w-full border rounded-lg p-2.5 bg-gray-50 text-sm" onchange="gestisciTipo()">
          <option value="Spesa">Spesa condivisa</option>
          <option value="Rimborso">Rimborso tra di noi</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Pagato da</label>
        <select id="pagatoDa" class="w-full border rounded-lg p-2.5 bg-gray-50 text-sm">
          <option value="Gigio">Gigio</option>
          <option value="Kia">Kia</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Importo (€)</label>
        <input type="number" step="0.01" id="importo" placeholder="0.00" required class="w-full border rounded-lg p-2.5 text-sm">
      </div>

      <div id="campoCategoria">
        <label class="block text-xs font-medium text-gray-600 mb-1">Categoria</label>
        <select id="categoria" class="w-full border rounded-lg p-2.5 bg-gray-50 text-sm">
          <option value="Spesa alimentare">Spesa alimentare</option>
          <option value="Spese per la casa">Spese per la casa</option>
          <option value="Affitto">Affitto</option>
          <option value="Bollette">Bollette</option>
          <option value="Arredamento">Arredamento</option>
          <option value="Elettrodomestici">Elettrodomestici</option>
          <option value="Piante">Piante</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Descrizione</label>
        <input type="text" id="descrizione" placeholder="es. Supermercato, Cena, ecc." required class="w-full border rounded-lg p-2.5 text-sm">
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold shadow hover:bg-indigo-700 transition">
        Salva Registrazione
      </button>
    </form>
  </section>

  <!-- DASHBOARD ANDAMENTO -->
  <section class="bg-white p-5 rounded-xl shadow">
    <h2 class="text-lg font-bold mb-3 text-gray-700">📊 Andamento Mensile</h2>
    <div id="andamentoList" class="space-y-2 text-sm text-gray-600">
      <p class="text-gray-400">Caricamento andamento...</p>
    </div>
  </section>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwATV2lBrpX6iVJY6In5Jl8PK_NJd61wtbkPpK4qd0/dev";

    async function caricaSaldo() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getSaldo`);
        const data = await res.json();
        document.getElementById('testoSaldo').innerText = data.testoSaldo || "Impossibile recuperare il saldo";
      } catch (e) {
        document.getElementById('testoSaldo').innerText = "Errore di connessione";
      }
    }

    async function caricaAndamento() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getAndamento`);
        const rows = await res.json();
        const container = document.getElementById('andamentoList');
        container.innerHTML = "";

        // Mostra gli ultimi 4 mesi registrati
        const header = rows[1];
        const dataRows = rows.slice(2).filter(r => r[0] && r[8] > 0).slice(-4);

        dataRows.forEach(row => {
          const div = document.createElement('div');
          div.className = "flex justify-between items-center border-b pb-2";
          div.innerHTML = `<span class="font-medium">${row[0]}</span> <span class="font-bold text-indigo-600">${parseFloat(row[8]).toFixed(2)} €</span>`;
          container.appendChild(div);
        });
      } catch (e) {
        console.error(e);
      }
    }

    function gestisciTipo() {
      const tipo = document.getElementById('tipo').value;
      const campoCat = document.getElementById('campoCategoria');
      if (tipo === "Rimborso") {
        campoCat.style.display = "none";
      } else {
        campoCat.style.display = "block";
      }
    }

    async function inviaDati(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "Salvataggio...";

      const oggi = new Date();
      const dataFormattata = `${String(oggi.getDate()).padStart(2, '0')}/${String(oggi.getMonth() + 1).padStart(2, '0')}/${oggi.getFullYear()}`;

      const payload = {
        data: dataFormattata,
        descrizione: document.getElementById('descrizione').value,
        categoria: document.getElementById('tipo').value === "Rimborso" ? "Rimborso" : document.getElementById('categoria').value,
        pagatoDa: document.getElementById('pagatoDa').value,
        importo: document.getElementById('importo').value,
        tipo: document.getElementById('tipo').value
      };

      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      alert("Registrato con successo!");
      document.getElementById('expenseForm').reset();
      btn.disabled = false;
      btn.innerText = "Salva Registrazione";
      caricaSaldo();
      caricaAndamento();
    }

    caricaSaldo();
    caricaAndamento();
  </script>
</body>
</html>
